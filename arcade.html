<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小游戏 - 鸟国网站</title>
    <meta name="description" content="站内自带的可玩游戏：2048、贪吃蛇、扫雷，支持键盘与触屏，离线可玩。" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      .arcade-shell { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--sp-5); align-items: start; }
      @media (max-width: 900px) { .arcade-shell { grid-template-columns: minmax(0, 1fr); } }
      .arcade-stage {
        position: relative;
        display: grid; place-items: center;
        min-height: 340px; padding: var(--sp-5) var(--sp-4); align-content: center;
        border: 1px solid var(--border-soft); border-radius: var(--r-lg);
        background:
          radial-gradient(700px 320px at 50% -10%, color-mix(in oklab, var(--primary) 12%, transparent), transparent 70%),
          var(--card);
        overflow: hidden;
        touch-action: manipulation;
      }
      .arcade-tabs { display: inline-flex; padding: 4px; gap: 4px; border: 1px solid var(--border); border-radius: var(--r-full); background: var(--card-2); }
      .arcade-tabs button {
        border: 0; background: transparent; color: var(--muted);
        padding: 7px 16px; border-radius: var(--r-full); font: inherit; font-size: var(--fs-sm); cursor: pointer;
        transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
      }
      .arcade-tabs button.is-on { color: var(--primary-ink); background: linear-gradient(135deg, var(--primary-2), var(--primary)); font-weight: 640; }
      .arcade-meta { display: flex; gap: var(--sp-4); align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: var(--sp-3); }
      .score-pill { font-variant-numeric: tabular-nums; font-size: var(--fs-sm); color: var(--muted); }
      .score-pill b { color: var(--text-strong); font-size: var(--fs-md); }

      /* 2048 */
      #board2048 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(360px, 82vw); }
      .tile { aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--r-md);
        background: var(--card-2); border: 1px solid var(--border-soft); font-weight: 700; font-size: 20px;
        color: var(--text); transition: background .12s ease, color .12s ease, transform .12s ease; }
      .tile[data-v="2"] { background: #e9eefb; color: #1b2433; }
      .tile[data-v="4"] { background: #d8e4fb; color: #1b2433; }
      .tile[data-v="8"] { background: #b9d3ff; color: #10203a; }
      .tile[data-v="16"] { background: #8fbcff; color: #08182c; }
      .tile[data-v="32"] { background: #62a6ff; color: #04101f; }
      .tile[data-v="64"] { background: #3d8bfd; color: #fff; }
      .tile[data-v="128"] { background: #6f6bf5; color: #fff; }
      .tile[data-v="256"] { background: #8b5cf6; color: #fff; }
      .tile[data-v="512"] { background: #b45cf6; color: #fff; }
      .tile[data-v="1024"] { background: #e05cc8; color: #fff; }
      .tile[data-v="2048"] { background: #ffb347; color: #221000; }
      .tile.is-new { animation: tilePop .16s var(--ease); }
      @keyframes tilePop { from { transform: scale(.86); opacity: .7; } }

      /* 扫雷 */
      #mineBoard { display: grid; gap: 4px; width: min(420px, 86vw); }
      .ms-cell {
        aspect-ratio: 1; min-height: 34px; display: grid; place-items: center;
        border-radius: 6px; border: 1px solid var(--border-soft);
        background: var(--card-2); color: var(--text);
        font-size: 13px; font-weight: 700; font-family: var(--font-mono);
        cursor: pointer; user-select: none;
      }
      .ms-cell.is-open { background: color-mix(in oklab, var(--card-2) 60%, var(--bg)); cursor: default; }
      .ms-cell.is-flag { color: var(--warn); }
      .ms-cell.is-mine { background: var(--err-soft); color: var(--err); }
      .ms-cell[data-n="1"] { color: #6aa9ff; } .ms-cell[data-n="2"] { color: #3ddc97; }
      .ms-cell[data-n="3"] { color: #ff8f6b; } .ms-cell[data-n="4"] { color: #b98bff; }
      .ms-cell[data-n="5"] { color: #ffc457; } .ms-cell[data-n="6+"] { color: #ff6b78; }

      #snakeCanvas { width: min(400px, 84vw); height: auto; border-radius: var(--r-md); background: #0b1220; }

      .arcade-overlay {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: color-mix(in oklab, var(--bg) 72%, transparent);
        backdrop-filter: blur(6px);
        text-align: center; padding: var(--sp-5);
      }
      .arcade-overlay h4 { margin-bottom: var(--sp-2); }
      .arcade-help { font-size: var(--fs-xs); color: var(--muted); line-height: 1.9; }
      .arcade-help kbd {
        font-family: var(--font-mono); font-size: 11px; padding: 1px 6px;
        border: 1px solid var(--border); border-radius: 5px; background: var(--card-2); color: var(--text);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="site-title"><a href="index.html">鸟国网站</a></h1>
        <nav class="site-nav">
          <a href="index.html">首页</a>

          <a href="android.html">安卓专区</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h2 id="sec-1">站内小游戏</h2>
          <p class="muted">纯本地运行、无需联网，支持键盘与触屏操作；成绩保存在当前浏览器。</p>
        </div>
      </section>

      <section class="section" style="padding-top:0;">
        <div class="container">
          <div class="arcade-shell">
            <div class="card" style="padding:var(--sp-4);">
              <div class="arcade-meta">
                <div class="arcade-tabs" id="arcadeTabs" role="tablist" aria-label="选择游戏">
                  <button type="button" role="tab" data-game="2048" class="is-on" aria-selected="true">2048</button>
                  <button type="button" role="tab" data-game="snake" aria-selected="false">贪吃蛇</button>
                  <button type="button" role="tab" data-game="mine" aria-selected="false">扫雷</button>
                </div>
                <div class="score-pill" id="arcadeScore">得分 <b>0</b></div>
              </div>

              <div class="arcade-stage" id="stage">
                <div id="board2048"></div>
                <canvas id="snakeCanvas" width="400" height="400" hidden></canvas>
                <div id="mineBoard" hidden></div>
                <div class="arcade-overlay" id="overlay" hidden>
                  <div>
                    <h4 id="overlayTitle">准备好了吗</h4>
                    <p class="muted" id="overlayText"></p>
                    <button class="btn primary" id="overlayBtn" type="button">开始</button>
                  </div>
                </div>
              </div>

              <div class="row" style="margin-top:var(--sp-4);">
                <button class="btn" id="restartBtn" type="button">重新开始</button>
                <button class="btn" id="pauseBtn" type="button">暂停</button>
                <span class="chip" id="gameState">进行中</span>
              </div>
            </div>

            <aside class="card">
              <h4>操作说明</h4>
              <div class="arcade-help" id="helpText"></div>
              <h4 style="margin-top:var(--sp-4);">最高分</h4>
              <p class="score-pill" id="bestScore">—</p>
              <p class="muted" style="margin-top:var(--sp-3); font-size:var(--fs-xs);">
                游戏逻辑全部在前端完成，不请求任何外部服务；关闭页面后最高分仍会保留。
              </p>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer"><div class="container"><span>© 2025 鸟国网站 niaoguo.com</span></div></footer>

    <script src="script.js"></script>
    <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var stage = $('stage'), overlay = $('overlay'), overlayTitle = $('overlayTitle');
      var overlayText = $('overlayText'), overlayBtn = $('overlayBtn');
      var scoreEl = $('arcadeScore'), stateEl = $('gameState'), helpEl = $('helpText'), bestEl = $('bestScore');

      var game = '2048';
      var paused = false;
      var score = 0;

      function best(key, val) {
        var k = 'niao.arcade.' + key;
        if (val === undefined) return parseInt(localStorage.getItem(k) || '0', 10) || 0;
        if (val > (parseInt(localStorage.getItem(k) || '0', 10) || 0)) {
          localStorage.setItem(k, String(val));
          return val;
        }
        return parseInt(localStorage.getItem(k) || '0', 10) || 0;
      }

      function setScore(n) {
        score = n;
        scoreEl.innerHTML = '得分 <b>' + n + '</b>';
        bestEl.textContent = '最高 ' + best(game, n) + ' 分';
      }

      function showOverlay(title, text, btn) {
        overlay.hidden = false;
        overlayTitle.textContent = title;
        overlayText.textContent = text || '';
        overlayBtn.textContent = btn || '开始';
      }
      function hideOverlay() { overlay.hidden = true; }

      /* ---------------- 2048 ---------------- */
      var g2048 = { cells: [], size: 4, over: false };
      var board2048 = $('board2048');

      function init2048() {
        g2048.cells = new Array(16).fill(0);
        g2048.over = false;
        paused = false;
        addTile(); addTile();
        render2048();
        setScore(0);
        stateEl.textContent = '进行中';
      }

      function addTile() {
        var empty = [];
        g2048.cells.forEach(function (v, i) { if (!v) empty.push(i); });
        if (!empty.length) return;
        var idx = empty[Math.floor(Math.random() * empty.length)];
        g2048.cells[idx] = Math.random() < 0.9 ? 2 : 4;
      }

      function render2048(newIdx) {
        board2048.innerHTML = g2048.cells.map(function (v, i) {
          return '<div class="tile' + (i === newIdx ? ' is-new' : '') + '" data-v="' + v + '">' + (v || '') + '</div>';
        }).join('');
      }

      function slideRow(row) {
        var vals = row.filter(Boolean);
        var out = [];
        for (var i = 0; i < vals.length; i++) {
          if (vals[i] === vals[i + 1]) { out.push(vals[i] * 2); score += vals[i] * 2; i++; }
          else out.push(vals[i]);
        }
        while (out.length < 4) out.push(0);
        return out;
      }

      function move2048(dir) {
        if (g2048.over || paused) return;
        var before = g2048.cells.join(',');
        var g = g2048.cells;
        for (var i = 0; i < 4; i++) {
          var row;
          if (dir === 'left') row = [g[i * 4], g[i * 4 + 1], g[i * 4 + 2], g[i * 4 + 3]];
          else if (dir === 'right') row = [g[i * 4 + 3], g[i * 4 + 2], g[i * 4 + 1], g[i * 4]];
          else if (dir === 'up') row = [g[i], g[i + 4], g[i + 8], g[i + 12]];
          else row = [g[i + 12], g[i + 8], g[i + 4], g[i]];
          var out = slideRow(row);
          for (var j = 0; j < 4; j++) {
            if (dir === 'left') g[i * 4 + j] = out[j];
            else if (dir === 'right') g[i * 4 + (3 - j)] = out[j];
            else if (dir === 'up') g[j * 4 + i] = out[j];
            else g[(3 - j) * 4 + i] = out[j];
          }
        }
        if (g.join(',') === before) return;
        addTile();
        render2048();
        setScore(score);
        if (g2048.cells.indexOf(2048) >= 0 && !g2048.won) {
          g2048.won = true;
          showOverlay('达成 2048！', '可以继续挑战更高分数。', '继续');
          overlayBtn.onclick = hideOverlay;
        }
        if (!canMove2048()) {
          g2048.over = true;
          stateEl.textContent = '已结束';
          showOverlay('本局结束', '得分 ' + score + '，最高 ' + best('2048', score), '再来一局');
          overlayBtn.onclick = function () { hideOverlay(); init2048(); };
        }
      }

      function canMove2048() {
        var g = g2048.cells;
        for (var i = 0; i < 16; i++) {
          if (!g[i]) return true;
          if (i % 4 !== 3 && g[i] === g[i + 1]) return true;
          if (i < 12 && g[i] === g[i + 4]) return true;
        }
        return false;
      }

      /* ---------------- 贪吃蛇 ---------------- */
      var snake = { timer: null, snake: [], dir: { x: 1, y: 0 }, food: { x: 5, y: 5 }, cell: 20, tick: 140, over: false };
      var canvas = $('snakeCanvas'), ctx = canvas.getContext('2d');

      function initSnake() {
        clearInterval(snake.timer);
        snake.snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
        snake.dir = { x: 1, y: 0 };
        snake.tick = 140;
        snake.over = false;
        paused = false;
        placeFood();
        setScore(0);
        stateEl.textContent = '进行中';
        drawSnake();
        snake.timer = setInterval(stepSnake, snake.tick);
      }

      function placeFood() {
        do {
          snake.food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) };
        } while (snake.snake.some(function (s) { return s.x === snake.food.x && s.y === snake.food.y; }));
      }

      function drawSnake() {
        ctx.fillStyle = '#0b1220';
        ctx.fillRect(0, 0, 400, 400);
        ctx.strokeStyle = 'rgba(120,160,255,.08)';
        for (var i = 0; i <= 20; i++) {
          ctx.beginPath(); ctx.moveTo(i * 20, 0); ctx.lineTo(i * 20, 400); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * 20); ctx.lineTo(400, i * 20); ctx.stroke();
        }
        ctx.fillStyle = '#ffc457';
        ctx.beginPath();
        ctx.arc(snake.food.x * 20 + 10, snake.food.y * 20 + 10, 7, 0, Math.PI * 2);
        ctx.fill();
        snake.snake.forEach(function (s, i) {
          ctx.fillStyle = i === 0 ? '#7cc4ff' : 'rgba(77,163,255,' + Math.max(0.35, 1 - i * 0.05) + ')';
          ctx.fillRect(s.x * 20 + 1, s.y * 20 + 1, 18, 18);
        });
      }

      function stepSnake() {
        if (paused || snake.over) return;
        var head = { x: snake.snake[0].x + snake.dir.x, y: snake.snake[0].y + snake.dir.y };
        if (head.x < 0 || head.y < 0 || head.x >= 20 || head.y >= 20 ||
            snake.snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
          snake.over = true;
          clearInterval(snake.timer);
          stateEl.textContent = '已结束';
          showOverlay('撞到了', '得分 ' + score + '，最高 ' + best('snake', score), '再来一局');
          overlayBtn.onclick = function () { hideOverlay(); initSnake(); };
          return;
        }
        snake.snake.unshift(head);
        if (head.x === snake.food.x && head.y === snake.food.y) {
          setScore(score + 10);
          placeFood();
          if (snake.tick > 70) {
            snake.tick -= 4;
            clearInterval(snake.timer);
            snake.timer = setInterval(stepSnake, snake.tick);
          }
        } else {
          snake.snake.pop();
        }
        drawSnake();
      }

      function turn(dx, dy) {
        if (paused) return;
        if (snake.dir.x === -dx && snake.dir.y === -dy) return; // 不能直接反向
        snake.dir = { x: dx, y: dy };
      }

      /* ---------------- 扫雷 ---------------- */
      var mine = { n: 9, mines: 0, cells: [], over: false, startedAt: 0 };

      function initMine() {
        mine.n = 9; mine.mines = 10; mine.over = false; paused = false;
        mine.cells = [];
        for (var i = 0; i < mine.n * mine.n; i++) mine.cells.push({ m: false, open: false, flag: false, n: 0 });
        var placed = 0;
        while (placed < mine.mines) {
          var k = Math.floor(Math.random() * mine.cells.length);
          if (!mine.cells[k].m) { mine.cells[k].m = true; placed++; }
        }
        for (var idx = 0; idx < mine.cells.length; idx++) {
          if (mine.cells[idx].m) continue;
          mine.cells[idx].n = neighbors(idx).filter(function (j) { return mine.cells[j].m; }).length;
        }
        setScore(0);
        stateEl.textContent = '进行中';
        renderMine();
      }

      function neighbors(i) {
        var x = i % mine.n, y = Math.floor(i / mine.n), out = [];
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          var nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < mine.n && ny < mine.n) out.push(ny * mine.n + nx);
        }
        return out;
      }

      function renderMine() {
        var board = $('mineBoard');
        board.style.gridTemplateColumns = 'repeat(' + mine.n + ', 1fr)';
        board.innerHTML = mine.cells.map(function (c, i) {
          var cls = 'ms-cell' + (c.open ? ' is-open' : '') + (c.flag ? ' is-flag' : '') + (c.m && c.open ? ' is-mine' : '');
          var label = c.open ? (c.m ? '✳' : (c.n || '')) : (c.flag ? '⚑' : '');
          return '<div class="' + cls + '" data-i="' + i + '" data-n="' + (c.n > 5 ? '6+' : c.n) + '">' + label + '</div>';
        }).join('');
      }

      function openCell(i) {
        var c = mine.cells[i];
        if (!c || c.open || c.flag || mine.over || paused) return;
        c.open = true;
        if (c.m) {
          mine.over = true;
          mine.cells.forEach(function (x) { if (x.m) x.open = true; });
          renderMine();
          stateEl.textContent = '已结束';
          showOverlay('踩到雷了', '点击“重新开始”再试一次。', '重新开始');
          overlayBtn.onclick = function () { hideOverlay(); initMine(); };
          return;
        }
        if (!c.n) neighbors(i).forEach(openCell);
        renderMine();
        checkWin();
      }

      function checkWin() {
        var ok = mine.cells.every(function (c) { return c.m || c.open; });
        if (!ok) return;
        mine.over = true;
        var s = Math.max(1, 100 - Math.round((Date.now() - mine.startedAt) / 1000));
        setScore(s);
        stateEl.textContent = '已通关';
        showOverlay('清完了！', '用时得分 ' + s + '，最高 ' + best('mine', s), '再来一局');
        overlayBtn.onclick = function () { hideOverlay(); initMine(); };
      }

      /* ---------------- 切换与输入 ---------------- */
      var HELP = {
        '2048': '方向键或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动方块；触屏可直接滑动。相同数字相撞会合并。',
        snake: '方向键或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 转向；触屏滑动。吃到黄点 +10 分，速度逐渐加快。',
        mine: '左键翻开、右键标旗；触屏点击翻开，长按插旗。翻完所有非雷格子即通关。'
      };

      function switchGame(name) {
        game = name;
        paused = false;
        clearInterval(snake.timer);
        $('board2048').hidden = name !== '2048';
        canvas.hidden = name !== 'snake';
        $('mineBoard').hidden = name !== 'mine';
        helpEl.innerHTML = HELP[name];
        bestEl.textContent = '最高 ' + best(name) + ' 分';
        Array.prototype.forEach.call($('arcadeTabs').querySelectorAll('button'), function (b) {
          var on = b.getAttribute('data-game') === name;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        hideOverlay();
        if (name === '2048') init2048();
        else if (name === 'snake') initSnake();
        else { initMine(); mine.startedAt = Date.now(); }
        setScore(0);
      }

      $('arcadeTabs').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-game]');
        if (b && b.getAttribute('data-game') !== game) switchGame(b.getAttribute('data-game'));
      });

      $('restartBtn').addEventListener('click', function () { switchGame(game); });
      $('pauseBtn').addEventListener('click', function () {
        if (game === '2048') return;
        paused = !paused;
        stateEl.textContent = paused ? '已暂停' : '进行中';
        $('pauseBtn').textContent = paused ? '继续' : '暂停';
      });

      document.addEventListener('keydown', function (e) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
        var k = e.key.toLowerCase();
        var map = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1],
                    a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
        if (!map[k]) return;
        e.preventDefault();
        if (game === '2048') {
          move2048(k.indexOf('arrow') === 0 ? k.replace('arrow', '') : { a: 'left', d: 'right', w: 'up', s: 'down' }[k]);
        } else if (game === 'snake') {
          turn(map[k][0], map[k][1]);
        }
      });

      // 触屏滑动
      var touchStart = null;
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
      }, { passive: true });
      stage.addEventListener('touchend', function (e) {
        if (!touchStart) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (game === '2048') {
          move2048(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        } else if (game === 'snake') {
          if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
          else turn(0, dy > 0 ? 1 : -1);
        }
      }, { passive: true });

      // 扫雷：点击 / 右键 / 长按
      var pressTimer = null;
      $('mineBoard').addEventListener('click', function (e) {
        var cell = e.target.closest('.ms-cell');
        if (!cell) return;
        if (!mine.startedAt) mine.startedAt = Date.now();
        openCell(parseInt(cell.getAttribute('data-i'), 10));
      });
      $('mineBoard').addEventListener('contextmenu', function (e) {
        var cell = e.target.closest('.ms-cell');
        if (!cell) return;
        e.preventDefault();
        var i = parseInt(cell.getAttribute('data-i'), 10);
        var c = mine.cells[i];
        if (!c || c.open || mine.over) return;
        c.flag = !c.flag;
        renderMine();
      });
      $('mineBoard').addEventListener('pointerdown', function (e) {
        if (e.pointerType !== 'touch') return;
        var cell = e.target.closest('.ms-cell');
        if (!cell) return;
        pressTimer = setTimeout(function () {
          var i = parseInt(cell.getAttribute('data-i'), 10);
          var c = mine.cells[i];
          if (c && !c.open) { c.flag = !c.flag; renderMine(); }
          pressTimer = null;
        }, 420);
      });
      $('mineBoard').addEventListener('pointerup', function () { clearTimeout(pressTimer); });
      $('mineBoard').addEventListener('pointercancel', function () { clearTimeout(pressTimer); });

      overlayBtn.addEventListener('click', function () { hideOverlay(); });

      var qp = new URLSearchParams(location.search).get('g');
      switchGame(['2048', 'snake', 'mine'].indexOf(qp) >= 0 ? qp : '2048');
    })();
    </script>
    <script src="nav-glider.js"></script>
  </body>
</html>
